<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .con{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
        #div1{
            background-color: rgba(0, 0, 255, 0.505);
            text-align: center;
            height: 50vh;
            overflow: scroll;
        }
        #div2{
            background-color: rgba(0, 128, 0, 0.578);
            text-align: center;
            height: 50vh;
            overflow: scroll;
            animation: loadroat forwards;
        }
        @keyframes loadroat {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
            
        }
        #div3{
            background-color: rgba(246, 255, 0, 0.505);
            text-align: center;
            height: 50vh;
            overflow: scroll;
        }
        #div4{
            background-color: rgba(255, 0, 255, 0.505);
            text-align: center;
            height: 50vh;
            overflow: scroll;
        }
        #div5{
            background-color: rgba(255, 0, 0, 0.505);
            text-align: center;
            height: 50vh;
            overflow: scroll;
        }
        #div6{
            background-color: rgba(0, 255, 136, 0.505);
            text-align: center;
            height: 50vh;
            overflow: scroll;
        }




        .anime1{
            animation: autoBLurAnimation linear both;
            animation-timeline: view(0% 0%);
            /* perspective: 50px; */
        }
        @keyframes autoBLurAnimation{
            0%{
                filter: blur(10px);
            }
            35%, 65%{
                filter: blur(0px);
            }
            100%{
                filter: blur(3px);
            }
        }


        .anime2{
            animation: rotation forwards;
            animation-timeline: view(40% 0%);
            transform: rotate(0deg);
        }

        

        @keyframes rotation {
            0%{
                transform: rotate(0deg);
                /* opacity: 0; */
            }15%{
                transform: rotate(90deg);
            }
            30%{
                /* opacity: 1; */
                transform: rotate(180deg);
            }45%{
                transform: rotate(270deg);
            }
            60%{
                transform: rotate(360deg);
            }
            
            100%{
                transform: rotate(360deg);
            }
        }

        .anime3{
            transform: translate(100%);
            animation: fadein both;
            animation-timeline: view(40% -10%);
        }

        @keyframes fadein {
            0%{
                opacity: 0;
            }
            100%{
                opacity: 1;
                transform: translate(0);
            }
        }












    </style>
</head>
<body>

    <div class="con">

        <div id="div1">
    
        </div>
        <div id="div2">
    
        </div>
        <div id="div3">
    
        </div>
        <div id="div4">
    
        </div>
        <div id="div5">
    
        </div>
        <div id="div6">
    
        </div>
    </div>

    <script src="54-index.js"></script>
</body>
</html>
